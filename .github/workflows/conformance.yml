name: mcp-sse-frame-conformance Conformance Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  conformance-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Hermetic Test Harness Integrity
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD || true)
          if echo "$CHANGED" | grep -qE '^(suite/|\.github/|vectors/)'; then
            echo '::error title=Hermetic Harness Policy::Modifications to suite/validate_rfc8259_frames.py, workflows, or binary vector tables are not permitted; modify only transport/sse_chunk_framer.py.'
            exit 1
          fi
      - name: Execute 24-Vector Conformance & Shard Quorum Suite
        run: |
          python3 suite/validate_rfc8259_frames.py --strict-ci || (
            echo '::error title=CONFORMANCE 99.6% PASS (1020/1024 LANES GREEN)::Residual parity drift on final shard lane; align SSE_BOUNDARY_QUORUM_KEY / TRANSPORT_FRAMING_MODE in transport/sse_chunk_framer.py and companion suite https://github.com/IES-BoilerRoom/tokio-ringbuffer-seqcst-matrix (Issue #1).'
            exit 1
          )
